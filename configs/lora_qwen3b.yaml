# mlx-lm LoRA config: Qwen2.5-3B-Instruct (4-bit) on LER coarse entities
model: mlx-community/Qwen2.5-3B-Instruct-4bit
train: true
data: data
adapter_path: adapters
fine_tune_type: lora
num_layers: 16
batch_size: 4
iters: 750            # 3000 train rows / batch 4 = exactly 1 epoch
learning_rate: 1.0e-4
max_seq_length: 768
mask_prompt: true     # loss on the JSON answer only
grad_checkpoint: true
steps_per_report: 25
steps_per_eval: 125
val_batches: 25
save_every: 125
seed: 13
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
